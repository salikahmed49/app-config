apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod
resources:
  - ../../base
  - namespace.yaml
labels:
  - pairs:
      env: prod
replicas:
  - name: frontend
    count: 3
  - name: productcatalogservice
    count: 2
  - name: cartservice
    count: 2
  - name: checkoutservice
    count: 2
  - name: loadgenerator
    count: 0
